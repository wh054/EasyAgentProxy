name: Windows regression tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Restore
        run: dotnet restore AppProxyHelper.Tests/AppProxyHelper.Tests.csproj --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build AppProxyHelper.Tests/AppProxyHelper.Tests.csproj -c Release --no-restore
      - name: Run C# regression tests
        run: dotnet AppProxyHelper.Tests/bin/Release/net10.0-windows/AppProxyHelper.Tests.dll
      - name: Run relay regression tests
        run: node --test scripts/antigravity-relay.test.cjs
